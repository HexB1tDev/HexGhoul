name: Release HexKagune

# Pushing a new or changed .github/release-notes-<version>.md builds the mod and publishes it as the latest release
# v<version> (the tag is created on the pushed commit; a version already released is left alone).
on:
  push:
    branches: [main, 'claude/**']
    paths: ['.github/release-notes-*.md']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and verify the mod JAR
        id: build
        run: |
          python3 build.py
          jar=$(ls build/hexkagune-*.jar)
          echo "jar=$jar" >> "$GITHUB_OUTPUT"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          JAR: ${{ steps.build.outputs.jar }}
        run: |
          name=$(basename "$JAR" .jar)
          version="${name#hexkagune-}"
          notes=".github/release-notes-$version.md"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released"
            exit 0
          fi
          [ -f "$notes" ] || echo "HexKagune $version" > "$notes"
          gh release create "v$version" "$JAR" --target "$GITHUB_SHA" --latest --title "HexKagune $version" --notes-file "$notes"

  # 2.1.7 (the owner: "clear the Releases page and leave only the 5 last, wipe all the actions but the 5 last"): after each release, only
  # the newest KEEP releases and the newest KEEP workflow runs are kept. The releases' tags are left alone. A run still going can't be
  # deleted and is skipped; the next release's cleanup takes it.
  cleanup:
    needs: release
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      KEEP: 5
    steps:
      - name: Keep only the newest releases
        run: |
          gh release list --limit 1000 --json tagName,createdAt --jq 'sort_by(.createdAt) | reverse | .[].tagName' > releases.txt
          tail -n +$((KEEP + 1)) releases.txt | while read -r tag; do
            echo "Deleting release $tag"
            gh release delete "$tag" --yes || echo "Could not delete release $tag"
          done
      - name: Keep only the newest workflow runs
        run: |
          gh api --paginate "repos/$GH_REPO/actions/runs?per_page=100" --jq '.workflow_runs[] | "\(.created_at) \(.id) \(.status)"' \
            | sort -r > runs.txt
          tail -n +$((KEEP + 1)) runs.txt | while read -r created id status; do
            if [ "$status" != "completed" ]; then
              echo "Skipping run $id ($status)"
              continue
            fi
            gh api -X DELETE "repos/$GH_REPO/actions/runs/$id" >/dev/null && echo "Deleted run $id" || echo "Could not delete run $id"
          done
